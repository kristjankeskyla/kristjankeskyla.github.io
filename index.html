<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Custom Camera Widget</title>

<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  #stage {
    position: fixed;
    inset: 0;
    background: url("Player_Wallpaper.jpg") center / cover no-repeat;
  }

  #widget {
    position: absolute;
    top: 80px;
    left: 80px;
    width: 360px;
    touch-action: none;
    user-select: none;
    cursor: grab;
    filter: drop-shadow(0 12px 30px rgba(0,0,0,.45));
  }
  #widget.dragging { cursor: grabbing; }

  #widgetInner {
    position: relative;
    width: 100%;
  }

  /* Webcam feed — z-index set in JS so it stays ABOVE the skin */
  #camVideo {
    position: absolute;
    object-fit: cover;
    background: #000;
    pointer-events: none;     /* clicks pass through to the shutter beneath */
    z-index: 4;
  }

  /* SVG: invisible, used only to locate the regions */
  #widgetInner svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }

  /* Player_Taust.png skin */
  #taust {
    position: absolute;
    inset: 0;
    background: url("Player_Taust.png") center / 100% 100% no-repeat;
    pointer-events: none;
    z-index: 3;
  }

  /* Transparent clickable shutter over the SVG "button" region */
  #shutterHit {
    position: absolute;
    cursor: pointer;
    background: transparent;
    border: 0;
    outline: none;
    z-index: 5;
  }
  #shutterHit:active { transform: scale(0.94); }

  #flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    transition: opacity .12s ease;
  }
  #flash.fire { opacity: .9; transition: none; }

  #tray {
    position: absolute;
    left: 0; right: 0;
    bottom: -78px;
    display: flex;
    gap: 8px;
    padding: 6px;
    overflow-x: auto;
    z-index: 7;
  }
  #tray a {
    flex: 0 0 auto;
    width: 64px; height: 64px;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,.85);
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
  }
  #tray img { width: 100%; height: 100%; object-fit: cover; display: block; }

  #status {
    position: fixed;
    bottom: 12px; left: 12px;
    color: #fff;
    background: rgba(0,0,0,.45);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="widget">
    <div id="widgetInner">
      <video id="camVideo" autoplay playsinline muted></video>
      <div id="taust"></div>
      <button id="shutterHit" aria-label="Take photo"></button>
      <div id="flash"></div>
      <div id="tray"></div>
    </div>
  </div>
</div>

<!-- Background music -->
<audio id="music" src="Smash Mouth - All Star.mp3" autoplay loop></audio>

<div id="status">Loading…</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  svgFile:   "Player_Layout.svg",
  videoElementId:  null,
  buttonElementId: null,
  videoKeywords:  /(video|cam|feed|screen|preview|view|display)/i,
  buttonKeywords: /(button|btn|capture|shutter|photo|snap|trigger|shoot)/i,

  // Video tuning ---------------------------------------------------------
  videoScale:   1.12,   // >1 = bigger (scales around the region's centre)
  videoOffsetX: 0,      // nudge right (+) / left (-), in % of widget width
  videoOffsetY: 0,      // nudge down (+) / up (-),   in % of widget height

  musicVolume:  0.6,
};

const widget      = document.getElementById("widget");
const widgetInner = document.getElementById("widgetInner");
const camVideo    = document.getElementById("camVideo");
const taust       = document.getElementById("taust");
const shutter     = document.getElementById("shutterHit");
const flash       = document.getElementById("flash");
const tray        = document.getElementById("tray");
const statusEl    = document.getElementById("status");
const music       = document.getElementById("music");

const setStatus = (msg) => { statusEl.textContent = msg; };

/* ---------- 1. Load the SVG inline so we can read its geometry ---------- */
async function loadLayout() {
  const res = await fetch(CONFIG.svgFile);
  if (!res.ok) throw new Error("Could not load " + CONFIG.svgFile);
  const text = await res.text();

  const doc = new DOMParser().parseFromString(text, "image/svg+xml");
  const svg = doc.documentElement;
  widgetInner.insertBefore(svg, taust);

  let vb = svg.viewBox && svg.viewBox.baseVal;
  if (!vb || !vb.width) {
    const w = parseFloat(svg.getAttribute("width")) || 300;
    const h = parseFloat(svg.getAttribute("height")) || 300;
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    vb = svg.viewBox.baseVal;
  }
  svg.removeAttribute("width");
  svg.removeAttribute("height");
  svg.setAttribute("preserveAspectRatio", "none");

  const aspect = vb.width / vb.height;
  const widthPx = Math.min(vb.width, window.innerWidth * 0.6) || 360;
  widget.style.width = widthPx + "px";
  widgetInner.style.height = (widthPx / aspect) + "px";

  return { svg, vb };
}

/* ---------- 2. Find tagged elements ---------- */
function findEl(svg, explicitId, keywords) {
  if (explicitId) {
    const el = svg.querySelector("#" + CSS.escape(explicitId));
    if (el) return el;
  }
  for (const el of svg.querySelectorAll("*")) {
    const label =
      (el.id || "") + " " +
      (el.getAttribute("class") || "") + " " +
      (el.getAttribute("inkscape:label") || "") + " " +
      (el.getAttribute("data-role") || "");
    if (keywords.test(label)) return el;
  }
  return null;
}

/* Position overlay over an SVG element, with optional scale + offset */
function placeOver(overlay, svgEl, vb, scale = 1, offX = 0, offY = 0) {
  const b = svgEl.getBBox();
  let left = ((b.x - vb.x) / vb.width)  * 100;
  let top  = ((b.y - vb.y) / vb.height) * 100;
  let w    = (b.width  / vb.width)  * 100;
  let h    = (b.height / vb.height) * 100;

  // scale around the centre so it grows symmetrically
  const cx = left + w / 2, cy = top + h / 2;
  w *= scale; h *= scale;
  left = cx - w / 2 + offX;
  top  = cy - h / 2 + offY;

  overlay.style.left = left + "%";
  overlay.style.top  = top  + "%";
  overlay.style.width  = w + "%";
  overlay.style.height = h + "%";

  if (overlay === shutter) {
    overlay.style.borderRadius =
      Math.abs(b.width - b.height) < 4 ? "50%" : "12px";
  }
}

/* ---------- 3. Webcam ---------- */
async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus("Camera API not supported by this browser."); return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }, audio: false
    });
    camVideo.srcObject = stream;
    setStatus("Camera live — drag the widget, click the button to snap.");
  } catch (err) {
    setStatus("Camera blocked/denied: " + err.message);
    camVideo.style.background =
      "repeating-linear-gradient(45deg,#222,#222 10px,#333 10px,#333 20px)";
  }
}

/* ---------- 4. Music (autoplay with interaction fallback) ---------- */
function startMusic() {
  music.volume = CONFIG.musicVolume;
  music.play().catch(() => {
    // Browser blocked autoplay — start on the first user gesture
    const resume = () => { music.play().catch(() => {}); };
    document.addEventListener("pointerdown", resume, { once: true });
    document.addEventListener("keydown",     resume, { once: true });
  });
}

/* ---------- 5. Take a photo ---------- */
function takePhoto() {
  if (!camVideo.videoWidth) { setStatus("No camera frame yet."); return; }

  const canvas = document.createElement("canvas");
  canvas.width  = camVideo.videoWidth;
  canvas.height = camVideo.videoHeight;
  canvas.getContext("2d").drawImage(camVideo, 0, 0);
  const dataUrl = canvas.toDataURL("image/png");

  flash.classList.add("fire");
  requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove("fire")));

  const link = document.createElement("a");
  link.href = dataUrl;
  link.download = "photo_" + Date.now() + ".png";
  link.title = "Click to download";
  const thumb = document.createElement("img");
  thumb.src = dataUrl;
  link.appendChild(thumb);
  tray.prepend(link);

  setStatus("Photo captured — click the thumbnail to download.");
}

/* ---------- 6. Dragging ---------- */
function makeDraggable(el) {
  let startX, startY, originLeft, originTop, dragging = false;

  el.addEventListener("pointerdown", (e) => {
    if (e.target === shutter) return;
    dragging = true;
    el.setPointerCapture(e.pointerId);
    const rect = el.getBoundingClientRect();
    originLeft = rect.left; originTop = rect.top;
    startX = e.clientX; startY = e.clientY;
    el.classList.add("dragging");
  });
  el.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    el.style.left = (originLeft + e.clientX - startX) + "px";
    el.style.top  = (originTop  + e.clientY - startY) + "px";
  });
  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove("dragging");
    try { el.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

/* ---------- 7. Boot ---------- */
(async function init() {
  try {
    const { svg, vb } = await loadLayout();

    const videoEl  = findEl(svg, CONFIG.videoElementId,  CONFIG.videoKeywords);
    const buttonEl = findEl(svg, CONFIG.buttonElementId, CONFIG.buttonKeywords);

    if (videoEl)
      placeOver(camVideo, videoEl, vb, CONFIG.videoScale, CONFIG.videoOffsetX, CONFIG.videoOffsetY);
    else setStatus("⚠ No video area found in SVG — set CONFIG.videoElementId.");

    if (buttonEl) placeOver(shutter, buttonEl, vb);
    else setStatus("⚠ No button area found in SVG — set CONFIG.buttonElementId.");

    shutter.addEventListener("click", (e) => { e.stopPropagation(); takePhoto(); });
    makeDraggable(widget);
    startMusic();
    await startCamera();
  } catch (err) {
    setStatus("Error: " + err.message);
    console.error(err);
  }
})();
</script>
</body>
</html>
