<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    overflow: hidden;
    background: #0a3a5c url('XP_Background.jpg') no-repeat center / cover;
    font-family: 'Share Tech Mono', monospace;
  }

  .player-wrapper {
    position: absolute;
    left: calc(50% - 336px);
    top: calc(50% - 250px);
    width: 672px;
    height: 500px;
    cursor: grab;
    filter: drop-shadow(0 10px 40px rgba(0,0,0,0.5));
  }

  .player-wrapper.dragging {
    cursor: grabbing;
    filter: drop-shadow(0 16px 50px rgba(0,0,0,0.6));
  }

  .skin-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: url('Player_Background.png') no-repeat center / contain;
  }

  .skin-svg {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .display-bg { fill: transparent; }
  .display-group { pointer-events: none; }

  /* Buttons */
  .btn-area {
    pointer-events: all;
    cursor: pointer;
    fill: transparent;
    transition: fill 0.15s, filter 0.15s;
  }
  .btn-area:hover {
    fill: rgba(255, 255, 255, 0.12);
    filter: drop-shadow(0 0 10px rgba(0, 200, 255, 0.3));
  }
  .btn-area:active { fill: rgba(0, 0, 0, 0.15); }

  .btn-symbol {
    pointer-events: none;
    fill: rgba(0, 40, 60, 0.7);
    transition: fill 0.15s;
  }

  .btn-group { pointer-events: none; }
  .btn-group .btn-area { pointer-events: all; }
  .btn-group:hover .btn-symbol { fill: rgba(0, 60, 80, 0.95); }
  .btn-group:active .btn-symbol { fill: rgba(0, 20, 30, 0.9); }

  .btn-group.playing .btn-area { fill: rgba(0, 200, 255, 0.08); }
  .btn-group.playing .btn-symbol {
    fill: rgba(0, 80, 100, 0.9);
    animation: symbolPulse 1.8s ease-in-out infinite;
  }

  @keyframes symbolPulse {
    0%, 100% { fill: rgba(0, 80, 100, 0.9); }
    50% { fill: rgba(0, 40, 60, 0.6); }
  }

  /* Seek bar */
  .seek-layer {
    position: absolute;
    left: 158px; top: 336px;
    width: 361px; height: 13px;
    z-index: 3;
  }

  .seek-track {
    position: absolute;
    top: 2px; left: 0; right: 0;
    height: 9px;
    background: transparent;
    border-radius: 5px;
    cursor: pointer;
    overflow: hidden;
  }

  .seek-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, rgba(0,60,80,0.5), rgba(0,120,160,0.4));
    border-radius: 5px;
    transition: width 0.15s;
  }

  .seek-thumb {
    position: absolute;
    top: 0; left: 0%;
    width: 13px; height: 13px;
    background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.6), rgba(0,180,220,0.3));
    border: 1.5px solid rgba(0,60,80,0.5);
    border-radius: 50%;
    cursor: pointer;
    z-index: 1;
    transition: transform 0.1s, box-shadow 0.15s;
    backdrop-filter: blur(2px);
  }
  .seek-thumb:hover {
    transform: scale(1.3);
    box-shadow: 0 0 12px rgba(0,200,255,0.3);
  }

  /* ═══════════════════════════════════════
     SONG TITLE — big serif, italic, scrolling
     ═══════════════════════════════════════ */
  .song-name-layer {
    position: absolute;
    left: 162px;
    top: 318px;
    z-index: 3;
    width: 354px;
    overflow: hidden;
    white-space: nowrap;
  }

  .song-name {
    display: inline-block;
    font-family: 'Silkscreen', monospace;
    font-size: 10px;
    color: rgba(224, 247, 250, 0.6);
    text-shadow: 0 0 6px rgba(0,180,220,0.2);
    animation: marquee 12s linear infinite;
    letter-spacing: 1px;
  }

  @keyframes marquee {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }

  /* ═══════════════════════════════════════
     BUBBLY VISUALIZER — circles not bars
     ═══════════════════════════════════════ */
  .bubble-viz {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .bubble-viz canvas {
    width: 100%;
    height: 100%;
  }

  /* ═══════════════════════════════════════
     TIME DISPLAY — moved to bottom-right
     ═══════════════════════════════════════ */
  .time-layer {
    position: absolute;
    right: 65px;
    bottom: 82px;
    z-index: 3;
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px;
    color: rgba(224, 247, 250, 0.55);
    text-shadow: 0 0 10px rgba(0,229,255,0.15);
    letter-spacing: 3px;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- AUDIO ELEMENT -->
<audio id="audio" preload="auto">
  <source src="Smash Mouth - All Star.m4a" type="audio/mp4">
</audio>

<div class="player-wrapper" id="player">
  <div class="skin-bg"></div>

  <svg class="skin-svg" viewBox="0 0 671.8 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="displayClip">
        <path d="M524.9,58.2c-55.9-26.9-108.5-12.4-153.5,0-19,5.2-114.3,31.4-114.2,68.4,0,14.9,15.5,21.8,116,78.9,72,40.9,101.9,58.9,135.1,88.6,35,31.4,35,53.2,50,52.6,35.8-1.3,85.6-112.8,49.1-201.7-23.7-57.6-74.2-82.9-82.4-86.8Z"/>
      </clipPath>
    </defs>

    <!-- CLIPPED DISPLAY -->
    <g clip-path="url(#displayClip)" class="display-group">
      <path class="display-bg"
        d="M524.9,58.2c-55.9-26.9-108.5-12.4-153.5,0-19,5.2-114.3,31.4-114.2,68.4,0,14.9,15.5,21.8,116,78.9,72,40.9,101.9,58.9,135.1,88.6,35,31.4,35,53.2,50,52.6,35.8-1.3,85.6-112.8,49.1-201.7-23.7-57.6-74.2-82.9-82.4-86.8Z"/>
      <foreignObject x="250" y="30" width="380" height="320">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;">
          <div class="bubble-viz">
            <canvas id="bubbleCanvas"></canvas>
          </div>
        </div>
      </foreignObject>
    </g>

    <!-- PLAY -->
    <g class="btn-group" id="btnPlayGroup">
      <path class="btn-area" id="btnPlay"
        d="M85.9,339.3c-4.2,4.7-11.7,14.1-16.6,29.9-3.3,10.7-10.4,33.5,0,58.8,10.4,25.3,31.6,36.5,36.1,38.7,27.7,14,54.5,5.6,72.1,0,16.6-5.2,42.5-16.9,41.1-26.3-1.1-7.3-17.5-5-41-19.7-6.8-4.2-20.6-13-31.6-29-9.9-14.4-17.3-34.1-22-46.5-4.9-13.1-6.4-19.6-12-21.3-9.5-3-21.5,10.3-26.1,15.3Z"/>
      <polygon class="btn-symbol" id="playSymbol" points="128.5,411.2 103.1,396.6 103.1,425.9"/>
    </g>

    <!-- STOP -->
    <g class="btn-group" id="btnStopGroup">
      <path class="btn-area" id="btnStop"
        d="M250,394.2c-16-13.2-42-16.7-48.7-7.3-4.2,5.9,0,15.5,1.3,18.5,11.8,27.2,55.3,39.9,64.4,29.4,6.5-7.6-3.1-29.1-17-40.6Z"/>
      <rect class="btn-symbol" x="228.8" y="403.5" width="13.9" height="13.9"/>
    </g>

    <!-- FORWARD -->
    <g class="btn-group" id="btnFwdGroup">
      <path class="btn-area" id="btnFwd"
        d="M274.8,394.5c-.4,3.6,6.8,4.3,9.8,12.3,2,5.3,1.5,12.2,1.3,14.8-.3,4.4-1.1,7,.5,10,1.5,2.6,3.9,3.8,5.4,4.4,2.3,1,6,2.2,18.6,0,6.1-1,11.1-1.9,17.7-4.4,7-2.7,10.5-4,13.3-7.2,5.1-6,4.5-14.2,4.1-17.6.4-2.3.9-7.5-2-12.3-3.2-5.4-8.8-7.1-13.7-8.5-4.1-1.2-11.3-2.6-28.8,0-12.8,1.9-25.6,3.9-26.2,8.5Z"/>
      <polygon class="btn-symbol" points="318.8,403.1 318.8,410.6 305.9,403.1 305.9,418.6 318.8,411.2 318.8,418.6 319.8,418.6 319.8,403.1"/>
    </g>
  </svg>

  <!-- SONG TITLE — pixel font above seek bar -->
  <div class="song-name-layer">
    <span class="song-name" id="songTitle">Smash Mouth — All Star</span>
  </div>

  <!-- SEEK BAR -->
  <div class="seek-layer">
    <div class="seek-track" id="seekTrack">
      <div class="seek-fill" id="seekFill"></div>
    </div>
    <div class="seek-thumb" id="seekThumb"></div>
  </div>

  <!-- TIME — bottom right of player -->
  <div class="time-layer" id="timeDisplay">00:00</div>
</div>

<script>
  const audio = document.getElementById('audio');
  const btnPlay = document.getElementById('btnPlay');
  const btnStop = document.getElementById('btnStop');
  const btnFwd = document.getElementById('btnFwd');
  const playGroup = document.getElementById('btnPlayGroup');
  const seekTrack = document.getElementById('seekTrack');
  const seekFill = document.getElementById('seekFill');
  const seekThumb = document.getElementById('seekThumb');
  const timeDisplay = document.getElementById('timeDisplay');
  let seeking = false;

  // ═══════════════════════════════════════
  // AUDIO CONTEXT + ANALYSER for visualizer
  // ═══════════════════════════════════════
  let audioCtx, analyser, dataArray, source, audioReady = false;

  function initAudio() {
    if (audioReady) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    audioReady = true;
  }

  // ═══════════════════════════════════════
  // PLAY / STOP / FWD
  // ═══════════════════════════════════════
  btnPlay.addEventListener('click', e => {
    e.stopPropagation();
    initAudio();
    const sym = document.getElementById('playSymbol');
    if (audio.paused) {
      audio.play();
      playGroup.classList.add('playing');
      // Swap to pause icon (two bars)
      const g = sym.parentNode;
      sym.remove();
      const ns = 'http://www.w3.org/2000/svg';
      const r1 = document.createElementNS(ns, 'rect');
      r1.setAttribute('class', 'btn-symbol');
      r1.setAttribute('id', 'playSymbol');
      r1.setAttribute('x', '103'); r1.setAttribute('y', '399');
      r1.setAttribute('width', '9'); r1.setAttribute('height', '26');
      
      const r2 = document.createElementNS(ns, 'rect');
      r2.setAttribute('class', 'btn-symbol');
      r2.setAttribute('id', 'playSymbol2');
      r2.setAttribute('x', '118'); r2.setAttribute('y', '399');
      r2.setAttribute('width', '9'); r2.setAttribute('height', '26');
      
      g.appendChild(r1);
      g.appendChild(r2);
    } else {
      audio.pause();
      playGroup.classList.remove('playing');
      // Swap back to play chevron
      const g = playGroup;
      const old1 = document.getElementById('playSymbol');
      const old2 = document.getElementById('playSymbol2');
      if (old1) old1.remove();
      if (old2) old2.remove();
      const ns = 'http://www.w3.org/2000/svg';
      const poly = document.createElementNS(ns, 'polygon');
      poly.setAttribute('class', 'btn-symbol');
      poly.setAttribute('id', 'playSymbol');
      poly.setAttribute('points', '128.5,411.2 103.1,396.6 103.1,425.9');
      g.appendChild(poly);
    }
  });

  btnStop.addEventListener('click', e => {
    e.stopPropagation();
    audio.pause();
    audio.currentTime = 0;
    playGroup.classList.remove('playing');
    seekFill.style.width = '0%';
    seekThumb.style.left = '0%';
    timeDisplay.textContent = '00:00';
    // Restore play chevron
    const old1 = document.getElementById('playSymbol');
    const old2 = document.getElementById('playSymbol2');
    if (old1) old1.remove();
    if (old2) old2.remove();
    const ns = 'http://www.w3.org/2000/svg';
    const poly = document.createElementNS(ns, 'polygon');
    poly.setAttribute('class', 'btn-symbol');
    poly.setAttribute('id', 'playSymbol');
    poly.setAttribute('points', '128.5,411.2 103.1,396.6 103.1,425.9');
    playGroup.appendChild(poly);
  });

  btnFwd.addEventListener('click', e => {
    e.stopPropagation();
    audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15);
  });

  // ═══════════════════════════════════════
  // TIME + SEEK SYNC
  // ═══════════════════════════════════════
  audio.addEventListener('timeupdate', () => {
    if (seeking || !audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    seekFill.style.width = pct + '%';
    seekThumb.style.left = (pct - 1) + '%';
    const m = String(Math.floor(audio.currentTime / 60)).padStart(2, '0');
    const s = String(Math.floor(audio.currentTime % 60)).padStart(2, '0');
    timeDisplay.textContent = m + ':' + s;
  });

  audio.addEventListener('ended', () => {
    playGroup.classList.remove('playing');
    const old1 = document.getElementById('playSymbol');
    const old2 = document.getElementById('playSymbol2');
    if (old1) old1.remove();
    if (old2) old2.remove();
    const ns = 'http://www.w3.org/2000/svg';
    const poly = document.createElementNS(ns, 'polygon');
    poly.setAttribute('class', 'btn-symbol');
    poly.setAttribute('id', 'playSymbol');
    poly.setAttribute('points', '128.5,411.2 103.1,396.6 103.1,425.9');
    playGroup.appendChild(poly);
  });

  function seekTo(e) {
    const rect = seekTrack.getBoundingClientRect();
    let pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    if (audio.duration) audio.currentTime = pct * audio.duration;
    seekFill.style.width = (pct * 100) + '%';
    seekThumb.style.left = (pct * 100 - 1) + '%';
  }

  seekTrack.addEventListener('mousedown', e => { e.stopPropagation(); seeking = true; seekTo(e); });
  seekThumb.addEventListener('mousedown', e => { e.stopPropagation(); seeking = true; });
  document.addEventListener('mousemove', e => { if (seeking) seekTo(e); });
  document.addEventListener('mouseup', () => { seeking = false; });

  // ═══════════════════════════════════════
  // BUBBLY VISUALIZER
  // ═══════════════════════════════════════
  const canvas = document.getElementById('bubbleCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    const r = canvas.parentElement.getBoundingClientRect();
    canvas.width = r.width * 2;
    canvas.height = r.height * 2;
    ctx.scale(2, 2);
  }

  // Bubble pool
  const bubbles = [];
  for (let i = 0; i < 70; i++) {
    bubbles.push({
      x: Math.random() * 380,
      y: Math.random() * 320,
      baseR: 3 + Math.random() * 12,
      r: 6,
      phase: Math.random() * Math.PI * 2,
      speed: 0.2 + Math.random() * 0.6,
      freqBin: Math.floor(Math.random() * 64),
      opacity: 0.85 + Math.random() * 0.15,
    });
  }

  let vizStarted = false;
  function startViz() {
    if (vizStarted) return;
    vizStarted = true;
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    animateViz();
  }

  function animateViz() {
    const w = canvas.width / 2;
    const h = canvas.height / 2;
    ctx.clearRect(0, 0, w, h);

    // Get frequency data if available
    let hasData = false;
    if (audioReady && !audio.paused) {
      analyser.getByteFrequencyData(dataArray);
      hasData = true;
    }

    const t = performance.now() * 0.001;

    for (const b of bubbles) {
      // Audio-reactive radius
      let energy = hasData ? dataArray[b.freqBin] / 255 : 0.2;
      b.r = b.baseR + energy * 16;

      // Float upward
      b.y -= b.speed * (0.5 + energy);
      b.x += Math.sin(t * 0.8 + b.phase) * 0.5;

      // Reset when off top — stay inside container
      if (b.y + b.r < 0) {
        b.y = h + b.r;
        b.x = Math.random() * w;
      }

      // Draw bubble
      const alpha = 1;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);

      // Gradient fill
      const grad = ctx.createRadialGradient(
        b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1,
        b.x, b.y, b.r
      );
      grad.addColorStop(0, `rgba(220, 248, 255, 1)`);
      grad.addColorStop(0.4, `rgba(0, 200, 240, 0.9)`);
      grad.addColorStop(1, `rgba(0, 100, 140, 0.6)`);
      ctx.fillStyle = grad;
      ctx.fill();

      // Highlight
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, 0.85)`;
      ctx.fill();
    }

    requestAnimationFrame(animateViz);
  }

  // Start viz immediately (will be idle until audio plays)
  setTimeout(startViz, 100);

  // ═══════════════════════════════════════
  // DRAG
  // ═══════════════════════════════════════
  const player = document.getElementById('player');
  let dragging = false, dragOffX = 0, dragOffY = 0;

  player.addEventListener('mousedown', e => {
    if (e.target.closest('.btn-area, .seek-layer')) return;
    dragging = true;
    dragOffX = e.clientX - player.offsetLeft;
    dragOffY = e.clientY - player.offsetTop;
    player.classList.add('dragging');
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    player.style.left = (e.clientX - dragOffX) + 'px';
    player.style.top = (e.clientY - dragOffY) + 'px';
  });

  document.addEventListener('mouseup', () => {
    dragging = false;
    player.classList.remove('dragging');
  });
</script>

</body>
</html>
