<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Oscillating Waves</title>

<style>
  html,
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: rgb(5, 15, 40);
  }

  canvas {
    display: block;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>

<body>

<script>
let waves = [];
let cols;
let rows;
let spacing = 18;
let t = 0;

function setup() {
  createCanvas(windowWidth, windowHeight);

  buildGrid();

  stroke(255);
  strokeWeight(1.2);
  noFill();
}

function buildGrid() {
  cols = floor(width / spacing);
  rows = floor(height / spacing);

  waves = [];

  for (let y = 0; y < rows; y++) {
    waves[y] = [];

    for (let x = 0; x < cols; x++) {
      waves[y][x] = {
        ox: x * spacing,
        oy: y * spacing,
        x: x * spacing,
        y: y * spacing,
        vx: 0,
        vy: 0
      };
    }
  }
}

function draw() {
  background(5, 15, 40);

  t += 0.015;

  for (let y = 0; y < rows; y++) {
    beginShape();

    for (let x = 0; x < cols; x++) {
      let p = waves[y][x];

      // Oscillating wave motion
      let wave =
        sin(x * 0.35 + t * 2 + y * 0.25) * 12 +
        cos(x * 0.15 - t * 1.5) * 8;

      let targetY = p.oy + wave;

      // Mouse explosion interaction
      let dx = p.x - mouseX;
      let dy = p.y - mouseY;
      let d = sqrt(dx * dx + dy * dy);

      if (d < 120) {
        let force = map(d, 0, 120, 18, 0);
        let angle = atan2(dy, dx);

        p.vx += cos(angle) * force * 0.08;
        p.vy += sin(angle) * force * 0.08;
      }

      // Spring return
      p.vx += (p.ox - p.x) * 0.02;
      p.vy += (targetY - p.y) * 0.02;

      // Damping
      p.vx *= 0.9;
      p.vy *= 0.9;

      // Update position
      p.x += p.vx;
      p.y += p.vy;

      curveVertex(p.x, p.y);
    }

    endShape();
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  buildGrid();
}
</script>

</body>
</html>
